# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# GENERAL

# don't wait after Esc (makes Esc in vim instant)
set -sg escape-time 10

# more scrollback
set -g history-limit 50000

# number windows and panes from 1 and keep window numbers contiguous
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# let vim notice when panes gain/lose focus (for autoread)
set -g focus-events on

# 256 colors and true color. tmux-256color's terminfo is missing on some
# systems (e.g. older macOS), so fall back to screen-256color.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
set -as terminal-features ',xterm-256color:RGB'

# show messages longer
set -g display-time 2000

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# KEY BINDINGS

# split panes using | and -, opening them in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# open new windows in the current directory
bind c new-window -c "#{pane_current_path}"

# reload config file
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# switch panes using vi keys with prefix
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# resize panes using capital vi keys with prefix
bind -r K resize-pane -U 5
bind -r J resize-pane -D 5
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5

# DESIGN TWEAKS

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour yellow

# copy mode
setw -g mode-style 'fg=black bg=red bold'

# panes
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=red'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=black bg=yellow'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=black bg=red'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=red bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
set -g message-style 'fg=yellow bg=red bold'

# COPY MODE

# enable vi mode-keys
setw -g mode-keys vi

# use "v" to enter visual mode to highlight, "C-v" for a block selection
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Copy to the system clipboard. OSC 52 works in most terminals, including over
# ssh. The copy-command covers local terminals that don't support it.
set -s set-clipboard on
if-shell 'command -v pbcopy' 'set -s copy-command "pbcopy"'
if-shell '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy' 'set -s copy-command "wl-copy"'
if-shell '[ -z "$WAYLAND_DISPLAY" ] && command -v xclip' 'set -s copy-command "xclip -selection clipboard"'

# use "y" to yank
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# use "prefix-P" to paste
bind P paste-buffer
